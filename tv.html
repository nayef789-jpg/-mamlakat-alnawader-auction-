.wrap{position:relative;z-index:2;width:94vw;max-width:1680px;height:92vh;display:flex;flex-direction:column;justify-content:center}
.topline{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:2.2vh}
.brand{display:flex;align-items:center;gap:18px}
.brand img{width:86px;height:86px;width:clamp(64px,6vw,100px);height:clamp(64px,6vw,100px);object-fit:cover;border-radius:50%;border:2px solid rgba(255,255,255,.26);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.brand .name{font-size:30px;font-size:clamp(22px,2.2vw,38px);font-weight:900;letter-spacing:.2px}
.live{font-size:18px;font-size:clamp(15px,1.3vw,22px);font-weight:800;display:flex;align-items:center;gap:10px;opacity:.85}
.live i{display:block;width:11px;height:11px;border-radius:50%;background:#39d98a;box-shadow:0 0 0 6px rgba(57,217,138,.14)}
.heading{text-align:center;font-weight:900;font-size:42px;font-size:clamp(28px,3vw,52px);margin:0 0 1.5vh;letter-spacing:.1px}
.winner{text-align:center;padding:30px 2vw;padding:clamp(20px,2.3vw,42px) 2vw;border:1px solid rgba(255,255,255,.14);border-radius:32px;background:rgba(255,255,255,.07);box-shadow:0 30px 90px rgba(0,0,0,.34)}
.crown{font-size:64px;font-size:clamp(42px,5vw,78px);line-height:1}
.winner-name{font-size:76px;font-size:clamp(50px,6.4vw,108px);line-height:1.02;font-weight:950;margin:.6vh 0 1vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bidder{font-size:26px;font-size:clamp(18px,2vw,32px);opacity:.72;font-weight:800}
.amount{font-size:64px;font-size:clamp(42px,5vw,82px);line-height:1.05;font-weight:950;margin-top:1.5vh;font-variant-numeric:tabular-nums}
.count{font-size:21px;font-size:clamp(17px,1.5vw,26px);opacity:.7;margin-top:.7vh}
.rank{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:1.7vh}
.card{min-width:0;text-align:center;padding:15px;padding:clamp(11px,1.2vw,20px);border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.055)}
.pos{opacity:.58;font-size:16px;font-size:clamp(13px,1.05vw,18px)}
.rname{font-weight:900;font-size:22px;font-size:clamp(17px,1.55vw,26px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:.4vh 0}
.rmoney{font-weight:900;font-size:20px;font-size:clamp(16px,1.4vw,23px)}
.empty{text-align:center;font-size:58px;font-size:clamp(34px,5vw,84px);font-weight:950;opacity:.82}
.empty small{display:block;margin-top:1.4vh;font-size:20px;font-size:clamp(17px,1.4vw,24px);font-weight:700;opacity:.6}
#login{position:fixed;z-index:50;inset:0;background:#05080d;display:none;align-items:center;justify-content:center;padding:24px}
.login-box{width:90vw;max-width:520px;text-align:center}
.login-logo{width:110px;height:110px;border-radius:50%;object-fit:cover;margin-bottom:24px}
.login-box h1{font-size:30px;margin:0 0 10px}
.login-box p{opacity:.65;line-height:1.7;margin:0 0 20px}
.login-box input{width:100%;border:1px solid #2e3949;background:#101722;color:#fff;border-radius:14px;padding:16px 18px;font-size:23px;text-align:center;outline:none}
.login-box button{width:100%;margin-top:12px;border:0;border-radius:14px;padding:15px;font-size:20px;font-weight:900;background:#fff;color:#101318;cursor:pointer}
.err{min-height:24px;margin-top:12px;color:#ff9c9c}
@media(max-width:800px){.rank{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{height:95vh}.brand .name{display:none}}
@media(max-height:620px){.topline{margin-bottom:1vh}.winner{padding:15px 2vw}.rank{margin-top:1vh}}

/* توافق مع متصفحات التلفزيون القديمة */
@supports not (width: clamp(1px, 2px, 3px)){
  .brand img{width:86px!important;height:86px!important}
  .brand .name{font-size:30px!important}.live{font-size:18px!important}.heading{font-size:42px!important}
  .winner{padding:30px 2vw!important}.crown{font-size:64px!important}.winner-name{font-size:76px!important}
  .bidder{font-size:26px!important}.amount{font-size:64px!important}.count{font-size:21px!important}
  .card{padding:15px!important}.pos{font-size:16px!important}.rname{font-size:22px!important}.rmoney{font-size:20px!important}
  .empty{font-size:58px!important}.empty small{font-size:20px!important}
}
</style>
</head>

function fetchCloud(done){
 if(refreshBusy||!pin()){if(done)done(false);return}
 refreshBusy=true;
 var xhr=new XMLHttpRequest();
 var url=CLOUD_URL+(CLOUD_URL.indexOf('?')>=0?'&':'?')+'_tv='+new Date().getTime();
 try{xhr.open('GET',url,true)}catch(e){refreshBusy=false;if(done)done(false);return}
 try{xhr.setRequestHeader('x-auction-pin',pin())}catch(e){}
 xhr.timeout=10000;
 xhr.onreadystatechange=function(){
  if(xhr.readyState!==4)return;
  refreshBusy=false;
  if(xhr.status===401){
   try{localStorage.removeItem(PIN_KEY)}catch(e){}
   showLogin('رمز الدخول غير صحيح');
   if(done)done(false);return;
  }
  if(xhr.status>=200&&xhr.status<300){
   try{
    var data=JSON.parse(xhr.responseText||'{}');
    if(data&&data.state){
     db=data.state;
     try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){}
     render();hideLogin();
     if(done)done(true);return;
    }
   }catch(e){}
  }
  if(done)done(false);
 };
 xhr.onerror=function(){refreshBusy=false;if(done)done(false)};
 xhr.ontimeout=function(){refreshBusy=false;if(done)done(false)};
 try{xhr.send(null)}catch(e){refreshBusy=false;if(done)done(false)}
}
function showLogin(msg){document.getElementById('login').style.display='flex';document.getElementById('err').textContent=msg||'';setTimeout(function(){try{document.getElementById('pin').focus()}catch(e){}},100)}
function hideLogin(){document.getElementById('login').style.display='none'}
document.getElementById('loginForm').addEventListener('submit',function(e){
 e.preventDefault();
 var v=document.getElementById('pin').value.replace(/^\s+|\s+$/g,'');
 if(!v)return;
 try{localStorage.setItem(PIN_KEY,v)}catch(err){}
 document.getElementById('err').textContent='جاري الاتصال...';
 fetchCloud(function(ok){
  if(ok){
   hideLogin();
   try{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen()}catch(err){}
  }else if(pin()){
   document.getElementById('err').textContent='تعذر الاتصال، حاول مرة ثانية';
  }
 });
});
readLocal();render();
if(pin()){
 hideLogin();
 fetchCloud(function(ok){
  if(!ok && !(db.buyers||[]).length){
   setTimeout(function(){fetchCloud()},1200);
  }
 });
}else{
 showLogin('');
}
setInterval(function(){fetchCloud()},3000);
