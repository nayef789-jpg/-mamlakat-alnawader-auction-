<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>مزاد عزبة مملكة النوادر</title>
  <style>
    :root{
      --bg:#f5f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;
      --accent:#111827;--ok:#047857;--warn:#b45309;--bad:#b91c1c;--blue:#1d4ed8;
      --shadow:0 8px 28px rgba(17,24,39,.08);--radius:18px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
    button,input,select{font:inherit}
    .app{max-width:1280px;margin:auto;min-height:100vh}
    header{position:sticky;top:0;z-index:20;background:rgba(17,24,39,.96);color:#fff;padding:14px 18px;backdrop-filter:blur(12px)}
    .top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:12px}
    .brand-logo{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#fff;border:2px solid rgba(255,255,255,.25)}
    .brand-text h1{font-size:20px;margin:0}.brand-text small{opacity:.75}
    .hero-brand{display:flex;align-items:center;gap:16px}
    .hero-logo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:#fff}
    .report-brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .report-brand img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
    @media(max-width:620px){.brand-logo{width:48px;height:48px}.hero-logo{width:82px;height:82px}}
    .head-actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:#e5e7eb;color:#111827;font-weight:700}
    .btn:hover{filter:brightness(.98)}
    .btn.dark{background:#111827;color:#fff}.btn.white{background:#fff}.btn.ok{background:#047857;color:#fff}
    .btn.blue{background:#1d4ed8;color:#fff}.btn.bad{background:#b91c1c;color:#fff}.btn.warn{background:#b45309;color:#fff}
    .btn.ghost{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.22)}
    nav{display:flex;gap:8px;overflow:auto;padding:12px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:72px;z-index:15}
    nav button{white-space:nowrap;border:0;border-radius:999px;padding:9px 14px;background:#f3f4f6;font-weight:800;cursor:pointer}
    nav button.active{background:#111827;color:#fff}
    main{padding:18px}
    .grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
    .stat b{font-size:28px;display:block;margin-top:4px}.stat span{color:var(--muted);font-weight:700}
    h2{font-size:22px;margin:0 0 14px}h3{margin:0 0 12px}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
    .form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
    label{display:block;font-size:12px;font-weight:800;color:#374151;margin-bottom:6px}
    input,select{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:11px 12px;background:#fff;outline:none}
    input:focus,select:focus{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}
    .actions{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
    table{width:100%;border-collapse:collapse;min-width:780px;background:#fff}
    th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;font-size:14px}
    th{background:#f9fafb;position:sticky;top:0}
    tr:last-child td{border-bottom:0}
    .badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:800;background:#f3f4f6}
    .badge.ok{background:#d1fae5;color:#065f46}.badge.bad{background:#fee2e2;color:#991b1b}.badge.warn{background:#fef3c7;color:#92400e}.badge.blue{background:#dbeafe;color:#1e40af}
    .hidden{display:none!important}
    .searchbar{display:flex;gap:8px;flex-wrap:wrap}.searchbar input{max-width:360px}
    .pen-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .pen{cursor:pointer}.pen:hover{transform:translateY(-1px)}.pen .num{font-size:30px;font-weight:900}.pen small{color:var(--muted)}
    .auction{max-width:820px;margin:auto}.auction .big{font-size:28px;font-weight:900}.auction .lookup{display:flex;gap:10px}.auction .lookup input{font-size:22px;padding:15px}
    .auction-result{margin-top:16px}.kv{display:grid;grid-template-columns:140px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
    .kv:last-child{border-bottom:0}.kv span:first-child{color:var(--muted);font-weight:800}
    .notice{padding:12px;border-radius:12px;background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe;margin-bottom:12px}
    .danger-note{padding:12px;border-radius:12px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;margin-bottom:12px}
    .money{font-variant-numeric:tabular-nums;font-weight:900}
    .small{font-size:12px;color:var(--muted)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:99}
    .modal-box{background:#fff;max-width:560px;width:100%;border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
    .split{display:flex;gap:10px}.split>*{flex:1}
    footer{padding:22px;color:var(--muted);text-align:center;font-size:12px}
    @media(max-width:900px){.g4,.g3,.g2,.form,.pen-grid{grid-template-columns:repeat(2,minmax(0,1fr))}nav{top:95px}}
    @media(max-width:620px){main{padding:12px}.g4,.g3,.g2,.form,.pen-grid{grid-template-columns:1fr}.auction .lookup{flex-direction:column}.top{align-items:flex-start}nav{top:118px}.kv{grid-template-columns:105px 1fr}}
    @media print{header,nav,.no-print,footer{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}main{padding:0}}
  </style>
</head>

<script>
const DB_KEY = 'sheepAuctionDB_v1';
const CLOUD_PIN_KEY = 'mamlakatAlnawaderCloudPin_v1';
const CLOUD_URL = 'https://kclizioxcbriyqhbaoar.supabase.co/functions/v1/auction-state';
let cloudVersion = 0;
let cloudReady = false;
let cloudSaving = false;
let cloudSaveQueued = false;
let cloudTimer = null;
let lastCloudDB = null;
const defaultDB = {
  settings:{title:'مزاد عزبة مملكة النوادر',commission:10,currency:'د.إ',pens:12},
  sellers:[], livestock:[], buyers:[], supporters:[],
  meta:{sellerSeq:1,buyerSeq:1,supporterSeq:1}
};
let db = loadDB();

function loadDB(){
  try{
    const raw=localStorage.getItem(DB_KEY);
    if(!raw) return structuredClone(defaultDB);
    const x=JSON.parse(raw);
    return {...structuredClone(defaultDB),...x,settings:{...defaultDB.settings,...(x.settings||{})},meta:{...defaultDB.meta,...(x.meta||{})}};
  }catch(e){ return structuredClone(defaultDB); }
}
function saveDB(){
  localStorage.setItem(DB_KEY,JSON.stringify(db));
  renderAll();
  queueCloudSave();
}
function setCloudStatus(text){
  const el=document.getElementById('cloudStatus');
  if(el) el.textContent=text;
}
function normalizeDB(x){
  return {...structuredClone(defaultDB),...(x||{}),settings:{...defaultDB.settings,...((x||{}).settings||{})},meta:{...defaultDB.meta,...((x||{}).meta||{})}};
}
function currentPin(){ return localStorage.getItem(CLOUD_PIN_KEY)||''; }
async function cloudRequest(method,payload){
  const pin=currentPin();
  if(!pin) return {ok:false,status:401,data:{error:'missing_pin'}};
  try{
    const res=await fetch(CLOUD_URL,{method,headers:{'Content-Type':'application/json','x-auction-pin':pin},body:payload?JSON.stringify(payload):undefined});
    let data={}; try{data=await res.json()}catch(_){ }
    return {ok:res.ok,status:res.status,data};
  }catch(err){
    return {ok:false,status:0,data:{error:'network',message:String(err)}};
  }
}
function showCloudLogin(message=''){
  cloudReady=false;
  setCloudStatus('الحفظ السحابي غير متصل');
  document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="modal-box">
    <h3>دخول نظام مزاد مملكة النوادر</h3>
    <div class="notice">أدخل رمز الدخول مرة واحدة على هذا الجهاز. بعد الدخول، كل البيانات تنحفظ أونلاين تلقائياً.</div>
    ${message?`<div class="danger-note">${esc(message)}</div>`:''}
    <form onsubmit="connectCloud(event)">
      <label>رمز الدخول</label>
      <input name="pin" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="رمز الدخول" required autofocus>
      <div class="actions" style="margin-top:14px"><button class="btn dark" type="submit">دخول</button></div>
    </form>
  </div></div>`;
}
async function connectCloud(e){
  e.preventDefault();
  const pin=new FormData(e.target).get('pin').trim();
  localStorage.setItem(CLOUD_PIN_KEY,pin);
  setCloudStatus('جاري التحقق من الحفظ السحابي...');
  const ok=await loadCloudState();
  if(!ok){ localStorage.removeItem(CLOUD_PIN_KEY); showCloudLogin('رمز الدخول غير صحيح أو تعذر الاتصال.'); }
}
async function loadCloudState(){
  const r=await cloudRequest('GET');
  if(!r.ok){
    if(r.status===401) return false;
    setCloudStatus('تعذر الاتصال بالسحابة — البيانات محفوظة مؤقتاً على هذا الجهاز');
    return true;
  }
  cloudVersion=Number(r.data.version||0);
  if(r.data.state){
    db=normalizeDB(r.data.state);
    lastCloudDB=structuredClone(db);
    localStorage.setItem(DB_KEY,JSON.stringify(db));
    renderAll();
  }else{
    const pushed=await pushCloudNow(true);
    if(!pushed) return false;
  }
  cloudReady=true;
  document.getElementById('modalRoot').innerHTML='';
  setCloudStatus('✓ البيانات محفوظة أونلاين');
  return true;
}
function queueCloudSave(){
  if(!cloudReady || !currentPin()) return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(()=>pushCloudNow(false),350);
}
async function pushCloudNow(initial=false){
  if(cloudSaving){ cloudSaveQueued=true; return true; }
  cloudSaving=true;
  setCloudStatus('جاري الحفظ أونلاين...');
  const snapshot=structuredClone(db);
  const expected=cloudVersion;
  const r=await cloudRequest('POST',{data:snapshot,version:expected});
  cloudSaving=false;
  if(r.ok){
    cloudVersion=Number(r.data.version||expected+1);
    lastCloudDB=structuredClone(snapshot);
    setCloudStatus('✓ البيانات محفوظة أونلاين');
    if(cloudSaveQueued){ cloudSaveQueued=false; queueCloudSave(); }
    return true;
  }
  if(r.status===409){
    if(r.data.state){
      db=normalizeDB(r.data.state);
      cloudVersion=Number(r.data.version||0);
      lastCloudDB=structuredClone(db);
      localStorage.setItem(DB_KEY,JSON.stringify(db));
      renderAll();
    }
    setCloudStatus('تم تحديث البيانات من جهاز آخر');
    alert('تم تعديل بيانات المزاد من جهاز آخر في نفس الوقت. تم تحميل أحدث نسخة حتى ما تضيع البيانات. أعد التعديل إذا لزم.');
    return false;
  }
  if(r.status===401){
    localStorage.removeItem(CLOUD_PIN_KEY);
    showCloudLogin('رمز الدخول غير صحيح.');
    return false;
  }
  setCloudStatus('تعذر الحفظ أونلاين — البيانات باقية مؤقتاً على هذا الجهاز');
  return false;
}
async function initCloud(){
  renderAll();
  if(!currentPin()){ showCloudLogin(); return; }
  setCloudStatus('جاري تحميل البيانات المحفوظة...');
  const ok=await loadCloudState();
  if(!ok){ localStorage.removeItem(CLOUD_PIN_KEY); showCloudLogin('رمز الدخول غير صحيح.'); }
}
function money(n){ return (Number(n)||0).toLocaleString('ar-AE',{minimumFractionDigits:0,maximumFractionDigits:2})+' '+db.settings.currency; }
function esc(s){ return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
function uid(prefix){ return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function sellerCode(){ return 'S'+String(db.meta.sellerSeq++).padStart(3,'0'); }
function buyerCode(){ return 'B'+String(db.meta.buyerSeq++).padStart(3,'0'); }
function supporterCode(){ return 'D'+String(db.meta.supporterSeq++).padStart(3,'0'); }
function sellerById(id){return db.sellers.find(x=>x.id===id)}
function buyerById(id){return db.buyers.find(x=>x.id===id)}
function findOrCreateBuyer(name,phone=''){
 name=String(name||'').trim(); phone=String(phone||'').trim();
 if(!name)return null;
 let b=db.buyers.find(x=>x.name.trim().toLowerCase()===name.toLowerCase() && (!phone || !x.phone || x.phone===phone));
 if(!b){
   b={id:uid('b_'),code:buyerCode(),name,phone,paid:0,adminPaid:0};
   db.buyers.push(b);
 }else if(phone && !b.phone){ b.phone=phone; }
 return b;
}
function supporterById(id){return (db.supporters||[]).find(x=>x.id===id)}
function headByNo(no){return db.livestock.find(x=>String(x.number)===String(no))}
function headSupports(h){return Array.isArray(h?.supports)?h.supports:[]}
function supportAmount(h){return headSupports(h).reduce((a,x)=>a+Number(x.amount||0),0)}
function headTotal(h){return h?.status==='sold' ? Number(h.salePrice||0)+supportAmount(h) : 0}
function commission(amount){ return (Number(amount)||0)*(Number(db.settings.commission)||0)/100; }
function netToSeller(h){ return h.status==='sold' ? (Number(h.salePrice||0)-commission(Number(h.salePrice||0))+supportAmount(h)) : 0; }
function supportText(h){
 const xs=headSupports(h);
 if(!xs.length)return '—';
 return xs.map(x=>`${esc(supporterById(x.supporterId)?.name||'داعم')} (${money(x.amount)})`).join('، ');
}
function findOrCreateSupporter(name,phone=''){
 name=String(name||'').trim(); phone=String(phone||'').trim();
 if(!name)return null;
 db.supporters=db.supporters||[];
 let d=db.supporters.find(x=>x.name.trim().toLowerCase()===name.toLowerCase() && (!phone || !x.phone || x.phone===phone));
 if(!d){
   d={id:uid('d_'),code:supporterCode(),name,phone,paid:0};
   db.supporters.push(d);
 }else if(phone && !d.phone){ d.phone=phone; }
 return d;
}
function supporterTotals(id){
 const d=supporterById(id);
 let total=0,count=0;
 db.livestock.filter(h=>h.status==='sold').forEach(h=>{
   headSupports(h).forEach(x=>{if(x.supporterId===id){total+=Number(x.amount||0);count++;}});
 });
 const paid=Number(d?.paid||0);
 return {count,total,paid,due:total-paid};
}

function calc(){
 const sold=db.livestock.filter(x=>x.status==='sold');
 const saleTotal=sold.reduce((a,h)=>a+Number(h.salePrice||0),0);
 const supportTotal=sold.reduce((a,h)=>a+supportAmount(h),0);
 const gross=saleTotal+supportTotal;
 const comm=sold.reduce((a,h)=>a+commission(Number(h.salePrice||0)),0);
 const buyerPaid=db.buyers.reduce((a,b)=>a+Number(b.adminPaid||0),0);
 const sellerDirect=saleTotal-comm;
 const ownerTotal=sellerDirect+supportTotal;
 return {sold,saleTotal,supportTotal,gross,comm,buyerPaid,sellerDirect,ownerTotal};
}

function addSeller(e){
 e.preventDefault();
 const f=new FormData(e.target), name=f.get('name').trim(), phone=f.get('phone').trim();
 if(!name) return alert('اكتب اسم المالك');
 db.sellers.push({id:uid('s_'),code:sellerCode(),name,phone,paidOut:0});
 e.target.reset(); saveDB();
}
function sellerTotals(sid){
 const hs=db.livestock.filter(h=>h.sellerId===sid);
 const sold=hs.filter(h=>h.status==='sold');
 const saleTotal=sold.reduce((a,h)=>a+Number(h.salePrice||0),0);
 const supportTotal=sold.reduce((a,h)=>a+supportAmount(h),0);
 const comm=sold.reduce((a,h)=>a+commission(Number(h.salePrice||0)),0);
 const buyerToSeller=saleTotal-comm;
 const net=buyerToSeller+supportTotal;
 const gross=saleTotal+supportTotal;
 return {count:hs.length,sold:sold.length,saleTotal,supportTotal,comm,buyerToSeller,gross,net};
}
function deleteSeller(id){
 if(db.livestock.some(h=>h.sellerId===id)) return alert('لا يمكن حذف المالك لأن لديه رؤوس مسجلة.');
 if(confirm('حذف المالك؟')){db.sellers=db.sellers.filter(x=>x.id!==id);saveDB();}
}
function renderSellers(){
 const rows=db.sellers.map(s=>{const t=sellerTotals(s.id);return `<tr>
   <td><b>${s.code}</b></td><td>${esc(s.name)}</td><td>${esc(s.phone)}</td>
   <td>${t.count}</td><td>${t.sold}</td><td class="money">${money(t.net)}</td><td class="money">${money(s.paidOut||0)}</td>
   <td><button class="btn bad" onclick="deleteSeller('${s.id}')">حذف</button></td></tr>`}).join('');
 document.getElementById('sellers').innerHTML=`

function addLivestock(e){
 e.preventDefault(); const f=new FormData(e.target);
 const number=f.get('number').trim(), sellerId=f.get('sellerId'), notes=f.get('notes').trim();
 if(!number||!sellerId) return alert('أدخل رقم الرأس واختر المالك');
 if(headByNo(number)) return alert('رقم الرأس مستخدم مسبقاً');
 db.livestock.push({id:uid('h_'),number,sellerId,pen:null,notes,status:'registered',buyerId:null,salePrice:0,soldAt:null});
 e.target.reset(); saveDB();
}
function deleteHead(id){
 const h=db.livestock.find(x=>x.id===id); if(!h) return;
 if(h.status==='sold') return alert('لا يمكن حذف رأس مباع. صحح عملية البيع أولاً.');
 if(confirm('حذف الرأس '+h.number+'؟')){db.livestock=db.livestock.filter(x=>x.id!==id);saveDB();}
}
function renderLivestock(){
 const sellerOptions=db.sellers.map(s=>`<option value="${s.id}">${s.code} — ${esc(s.name)}</option>`).join('');
 const rows=db.livestock.map(h=>{const s=sellerById(h.sellerId);return `<tr>
  <td><b>${esc(h.number)}</b></td><td>${s?esc(s.code+' — '+s.name):'-'}</td><td>${h.pen||'-'}</td><td>${statusBadge(h.status)}</td>
  <td>${esc(h.notes||'')}</td><td><button class="btn" onclick="printTag('${h.id}')">طباعة رقم</button> <button class="btn bad" onclick="deleteHead('${h.id}')">حذف</button></td></tr>`}).join('');
 document.getElementById('livestock').innerHTML=`
 <div class="section-head"><div><h2>تسجيل الرؤوس</h2><div class="small">كل رأس له رقم فريد مربوط بمالكه</div></div></div>
 <div class="card"><form class="form" onsubmit="addLivestock(event)">
   <div><label>رقم الرأس</label><input name="number" required inputmode="numeric" placeholder="مثال: 101"></div>
   <div><label>المالك</label><select name="sellerId" required><option value="">اختر المالك</option>${sellerOptions}</select></div>
   <div><label>ملاحظات</label><input name="notes" placeholder="اختياري"></div>
   <div class="actions"><button class="btn dark" type="submit">إضافة الرأس</button></div>
 </form></div>

  <div class="table-wrap"><table><thead><tr><th>رقم الرأس</th><th>المالك</th><th>الشبك</th><th>الحالة</th><th>ملاحظات</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="6">لا توجد رؤوس مسجلة.</td></tr>'}</tbody></table></div>
 </div>`;
}

function moveHead(e){
 e.preventDefault(); const f=new FormData(e.target), no=f.get('number').trim(), pen=Number(f.get('pen'));
 const h=headByNo(no); if(!h) return alert('رقم الرأس غير موجود');
 if(pen<1||pen>db.settings.pens) return alert('رقم الشبك غير صحيح');
 h.pen=pen; e.target.reset(); saveDB();
}
function showPen(n){
 const heads=db.livestock.filter(h=>Number(h.pen)===Number(n));
 const rows=heads.map(h=>`<tr><td><b>${esc(h.number)}</b></td><td>${esc(sellerById(h.sellerId)?.name||'-')}</td><td>${statusBadge(h.status)}</td></tr>`).join('');
 showModal(`<h3>الشبك ${n}</h3><div class="table-wrap"><table><thead><tr><th>الرأس</th><th>المالك</th><th>الحالة</th></tr></thead><tbody>${rows||'<tr><td colspan="3">الشبك فارغ.</td></tr>'}</tbody></table></div>`);
}
function renderPens(){
 const cards=Array.from({length:db.settings.pens},(_,i)=>i+1).map(n=>{
   const hs=db.livestock.filter(h=>Number(h.pen)===n), sold=hs.filter(h=>h.status==='sold').length;
   return `<div class="card pen" onclick="showPen(${n})"><div class="num">شبك ${n}</div><small>${hs.length} رأس — ${sold} مباع</small></div>`;
 }).join('');
 document.getElementById('pens').innerHTML=`
 <div class="section-head"><div><h2>الشبوك</h2><div class="small">وزّع أي رأس على أي شبك، حتى لو كان الشبك مكس</div></div></div>
 <div class="card"><form class="form" onsubmit="moveHead(event)">
  <div><label>رقم الرأس</label><input name="number" required placeholder="مثال: 101"></div>
  <div><label>رقم الشبك</label><select name="pen">${Array.from({length:db.settings.pens},(_,i)=>`<option value="${i+1}">شبك ${i+1}</option>`).join('')}</select></div>
  <div class="actions"><button class="btn dark" type="submit">توزيع / نقل</button></div>
 </form></div>
 <div class="pen-grid" style="margin-top:14px">${cards}</div>`;
}

function addBuyer(e){
 e.preventDefault(); const f=new FormData(e.target), name=f.get('name').trim(), phone=f.get('phone').trim();
 if(!name) return alert('اكتب اسم المشتري');
 db.buyers.push({id:uid('b_'),code:buyerCode(),name,phone,paid:0});
 e.target.reset(); saveDB();
}
function buyerTotals(bid){
 const hs=db.livestock.filter(h=>h.buyerId===bid&&h.status==='sold');
 const total=hs.reduce((a,h)=>a+Number(h.salePrice||0),0);
 const fee=hs.reduce((a,h)=>a+commission(Number(h.salePrice||0)),0);
 const sellerShare=total-fee;
 const b=buyerById(bid);
 const paid=Number(b?.adminPaid||0);
 return {count:hs.length,total,fee,sellerShare,paid,due:fee-paid};
}
function deleteBuyer(id){
 if(db.livestock.some(h=>h.buyerId===id)) return alert('لا يمكن حذف مشتري لديه مشتريات.');
 if(confirm('حذف المشتري؟')){db.buyers=db.buyers.filter(x=>x.id!==id);saveDB();}
}
function renderBuyers(){
 const rows=db.buyers.map(b=>{const t=buyerTotals(b.id);return `<tr>
  <td><b>${b.code}</b></td><td>${esc(b.name)}</td><td>${esc(b.phone)}</td><td>${t.count}</td>
  <td class="money">${money(t.total)}</td><td class="money">${money(t.paid)}</td><td class="money">${money(t.due)}</td>
  <td><button class="btn bad" onclick="deleteBuyer('${b.id}')">حذف</button></td></tr>`}).join('');
 document.getElementById('buyers').innerHTML=`
 <div class="section-head"><div><h2>المشترين</h2><div class="small">كل مشتري يأخذ رقم مزايد تلقائي</div></div></div>
 <div class="card"><form class="form" onsubmit="addBuyer(event)">
   <div><label>اسم المشتري</label><input name="name" required></div><div><label>رقم الهاتف</label><input name="phone" inputmode="tel"></div>
   <div class="actions"><button class="btn dark" type="submit">إضافة المشتري</button></div>
 </form></div>
 <div class="card" style="margin-top:14px"><div class="table-wrap"><table><thead><tr><th>رقم المزايد</th><th>الاسم</th><th>الهاتف</th><th>المشتريات</th><th>الإجمالي</th><th>دفع</th><th>المتبقي</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="8">لا يوجد مشترون.</td></tr>'}</tbody></table></div></div>`;
}

 <div class="kv"><span>إجمالي مستحق راعي الحلال</span><b class="money">${money(netToSeller(h))}</b></div>
 `:''}
 <div class="actions no-print" style="margin-top:14px">
  ${h.status!=='sold'?`<button class="btn ok" onclick="saleDialog('${h.id}')">تم البيع</button><button class="btn bad" onclick="markUnsold('${h.id}')">لم يتم البيع</button>`:

}
function saleDialog(id){
 const h=db.livestock.find(x=>x.id===id); if(!h)return;
 const opts=db.buyers.map(b=>`<option value="${b.id}">${b.code} — ${esc(b.name)}</option>`).join('');
 showModal(`<h3>تسجيل بيع الرأس ${esc(h.number)}</h3>
  <form onsubmit="confirmSale(event,'${h.id}')">
   <div class="notice"><b>المشتري:</b> تقدر تختار مشتري مسجل من القائمة، أو تكتب اسم مشتري جديد وقت البيع والنظام بيسجله تلقائياً.</div>
   <div style="margin-bottom:10px"><label>مشتري مسجل</label><select name="buyerId"><option value="">— اختر إذا كان مسجل —</option>${opts}</select></div>
   <div class="split">
    <div><label>اسم مشتري جديد</label><input name="buyerName" placeholder="اكتب الاسم إذا مب مسجل"></div>
    <div><label>هاتف المشتري</label><input name="buyerPhone" inputmode="tel" placeholder="اختياري"></div>
   </div>
   <div style="margin-top:10px;margin-bottom:14px"><label>سعر المزايدة على المشتري</label><input name="price" type="number" min="0" step="0.01" required inputmode="decimal"></div>

   <div class="split">
    <div><label>اسم الداعم</label><input name="supporterName" placeholder="اختياري"></div>
    <div><label>هاتف الداعم</label><input name="supporterPhone" inputmode="tel" placeholder="اختياري"></div>
   </div>
   <div style="margin-top:10px;margin-bottom:14px"><label>مبلغ الدعم</label><input name="supportAmount" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"></div>
   <div class="actions"><button class="btn ok" type="submit">تأكيد البيع</button><button class="btn" type="button" onclick="closeModal()">إلغاء</button></div>
  </form>`);
}
function confirmSale(e,id){
 e.preventDefault(); const f=new FormData(e.target), h=db.livestock.find(x=>x.id===id);
 const selectedBuyerId=String(f.get('buyerId')||'').trim();
 const buyerName=String(f.get('buyerName')||'').trim();
 const buyerPhone=String(f.get('buyerPhone')||'').trim();
 const price=Number(f.get('price'));
 let b=null;
 if(buyerName){
   b=findOrCreateBuyer(buyerName,buyerPhone);
 }else if(selectedBuyerId){
   b=buyerById(selectedBuyerId);
   if(b && buyerPhone && !b.phone) b.phone=buyerPhone;
 }
 const supporterName=String(f.get('supporterName')||'').trim();
 const supporterPhone=String(f.get('supporterPhone')||'').trim();
 const extra=Number(f.get('supportAmount')||0);
 if(!b) return alert('اختر مشتري مسجل أو اكتب اسم المشتري');
 if(price<0||extra<0) return alert('تحقق من البيانات');
 if(extra>0&&!supporterName) return alert('اكتب اسم الداعم');
 const total=price+extra;
 if(!confirm(`تأكيد بيع الرأس ${h.number} إلى ${b.code} — ${b.name}\nسعر المزايدة: ${money(price)}${extra>0?`\nالدعم: ${money(extra)}\nإجمالي الصفقة: ${money(total)}`:''}؟`)) return;
 h.status='sold';h.buyerId=b.id;h.salePrice=price;h.soldAt=new Date().toISOString();h.supports=[];
 if(extra>0){
   const d=findOrCreateSupporter(supporterName,supporterPhone);
   h.supports.push({id:uid('sup_'),supporterId:d.id,amount:extra,createdAt:new Date().toISOString()});
 }
 closeModal();saveDB();setTimeout(()=>{document.getElementById('auctionHead').value='';document.getElementById('auctionHead').focus()},50);
}
function markUnsold(id){
 const h=db.livestock.find(x=>x.id===id); if(confirm('تسجيل الرأس '+h.number+' كـ لم يتم البيع؟')){h.status='unsold';h.buyerId=null;h.salePrice=0;h.soldAt=null;h.supports=[];saveDB();}
}
function undoSale(id){
 const h=db.livestock.find(x=>x.id===id);
 if(confirm('إلغاء نتيجة البيع وإرجاع الرأس إلى حالة مسجل؟')){h.status='registered';h.buyerId=null;h.salePrice=0;h.soldAt=null;h.supports=[];saveDB();}
}
function addSupportDialog(id){
 const h=db.livestock.find(x=>x.id===id); if(!h||h.status!=='sold')return;
 showModal(`<h3>إضافة دعم للرأس ${esc(h.number)}</h3>
  <div class="notice">سعر المزايدة الحالي: <b>${money(h.salePrice)}</b> — الدعم الحالي: <b>${money(supportAmount(h))}</b></div>
  <form onsubmit="confirmSupport(event,'${h.id}')">
   <div class="split">
    <div><label>اسم الداعم</label><input name="name" required></div>
    <div><label>رقم الهاتف</label><input name="phone" inputmode="tel"></div>
   </div>
   <div style="margin-top:10px"><label>مبلغ الدعم</label><input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required></div>
   <div class="actions" style="margin-top:14px"><button class="btn blue" type="submit">إضافة الدعم</button><button class="btn" type="button" onclick="closeModal()">إلغاء</button></div>
  </form>`);
}
function confirmSupport(e,id){
 e.preventDefault(); const f=new FormData(e.target),h=db.livestock.find(x=>x.id===id);
 const name=String(f.get('name')||'').trim(),phone=String(f.get('phone')||'').trim(),amount=Number(f.get('amount')||0);
 if(!name||!(amount>0))return alert('تحقق من اسم الداعم ومبلغ الدعم');
 const d=findOrCreateSupporter(name,phone);
 h.supports=h.supports||[];
 h.supports.push({id:uid('sup_'),supporterId:d.id,amount,createdAt:new Date().toISOString()});
 closeModal();saveDB();
}
function addSupporterPayment(id){
 const d=supporterById(id),t=supporterTotals(id);
 const v=prompt(`المتبقي على الداعم ${d.name}: ${money(t.due)}\nأدخل مبلغ الدفعة:`);
 if(v===null)return; const n=Number(v); if(!(n>0))return alert('مبلغ غير صحيح');
 if(n>t.due && !confirm(`المبلغ أكبر من المتبقي (${money(t.due)}). تسجيله رغم ذلك؟`))return;
 d.paid=Number(d.paid||0)+n; saveDB();
}

function addBuyerPayment(id){
 const b=buyerById(id), t=buyerTotals(id);
 const v=prompt(`المتبقي من عمولة المزاد على ${b.name}: ${money(t.due)}\nأدخل المبلغ الذي حوّله لإدارة المزاد:`);
 if(v===null)return; const n=Number(v); if(!(n>0))return alert('مبلغ غير صحيح');
 if(n>t.due && !confirm(`المبلغ أكبر من المتبقي (${money(t.due)}). تسجيله رغم ذلك؟`))return;
 b.adminPaid=Number(b.adminPaid||0)+n; saveDB();
}
function addSellerPayout(id){
 const s=sellerById(id), t=sellerTotals(id), due=t.net-Number(s.paidOut||0);
 const v=prompt(`المتبقي للمالك ${s.name}: ${money(due)}\nأدخل المبلغ المدفوع له:`);
 if(v===null)return; const n=Number(v); if(!(n>0))return alert('مبلغ غير صحيح');
 s.paidOut=Number(s.paidOut||0)+n; saveDB();
}

  <td class="money">${money(t.fee)}</td>
  <td class="money">${money(t.paid)}</td>
  <td class="money">${money(t.due)}</td>
  <td class="money">${money(t.sellerShare)}</td>
  <td><button class="btn blue" onclick="addBuyerPayment('${b.id}')">تسجيل تحويل العمولة</button></td></tr>`}).join('');
 const sellerRows=db.sellers.map(s=>{const t=sellerTotals(s.id);return `<tr>

 <div class="card"><h3>عمولة إدارة المزاد من المشترين</h3><div class="table-wrap"><table><thead><tr>
  <th>المشتري</th><th>الرؤوس</th><th>إجمالي الشراء</th><th>عمولة الإدارة</th><th>حوّل للإدارة</th><th>المتبقي للإدارة</th><th>يروح للملاك</th><th></th>
 </tr></thead><tbody>${buyerRows||'<tr><td colspan="8">لا توجد بيانات.</td></tr>'}</tbody></table></div></div>
 <div class="card" style="margin-top:14px"><h3>مستحقات الملاك — للمعلومية</h3><div class="small" style="margin-bottom:10px">هذه مبالغ تُدفع مباشرة للملاك وليست مبالغ تستلمها إدارة المزاد.</div><div class="table-wrap"><table><thead><tr>
  <th>المالك</th><th>المباع</th><th>إجمالي مزايدات المشترين</th><th>من المشترين بعد العمولة</th><th>الدعم</th><th>إجمالي مستحق المالك</th>
 </tr></thead><tbody>${sellerRows||'<tr><td colspan="6">لا توجد بيانات.</td></tr>'}</tbody></table></div></div>
 <div class="card" style="margin-top:14px"><h3>الدعم — للمعلومية فقط</h3><div class="small" style="margin-bottom:10px">الدعم لا يدخل في عمولة إدارة المزاد ولا يتم تحصيله عن طريق الإدارة.</div><div class="table-wrap"><table><thead><tr><th>الداعم</th><th>مرات الدعم</th><th>إجمالي الدعم لراعي الحلال</th></tr></thead><tbody>${supporterRows||'<tr><td colspan="3">لا يوجد دعم مسجل.</td></tr>'}</tbody></table></div></div>`;
}
function sellerReportHTML(id){
 const s=sellerById(id); if(!s)return '<div class="danger-note">البائع غير موجود.</div>';
 const hs=db.livestock.filter(h=>h.sellerId===id);
 const t=sellerTotals(id);
 const rows=hs.map(h=>`<tr>
  <td><b>${esc(h.number)}</b></td><td>${h.pen||'—'}</td><td>${statusBadge(h.status)}</td>

  <div class="card stat"><span>من المشترين بعد العمولة</span><b>${money(t.buyerToSeller)}</b></div>

function supporterReportHTML(id){
 const d=supporterById(id); if(!d)return '<div class="danger-note">الداعم غير موجود.</div>';
 const t=supporterTotals(id), rows=[];
 db.livestock.filter(h=>h.status==='sold').forEach(h=>headSupports(h).forEach(x=>{
   if(x.supporterId===id)rows.push(`<tr><td><b>${esc(h.number)}</b></td><td>${esc(sellerById(h.sellerId)?.name||'—')}</td><td>${esc(buyerById(h.buyerId)?.name||'—')}</td><td class="money">${money(x.amount)}</td></tr>`);
 }));
 return `<h2>تقرير الداعم — ${d.code} — ${esc(d.name)}</h2>
 <div class="card stat" style="margin-bottom:14px"><span>إجمالي الدعم لراعي الحلال</span><b>${money(t.total)}</b></div>
 <div class="small" style="margin-bottom:10px">الدعم لا يدخل في عمولة إدارة المزاد.</div>
 <div class="table-wrap"><table><thead><tr><th>رقم الرأس</th><th>البائع</th><th>المشتري</th><th>مبلغ الدعم</th></tr></thead><tbody>${rows.join('')||'<tr><td colspan="4">لا يوجد دعم.</td></tr>'}</tbody></table></div>`;
}
function openPersonReport(type,id){
 if(!id)return alert('اختر الاسم أولاً');
 const html=type==='seller'?sellerReportHTML(id):type==='buyer'?buyerReportHTML(id):supporterReportHTML(id);
 showModal(`<div class="section-head"><div><h3>التقرير المستقل</h3></div><div class="actions"><button class="btn dark" onclick="printPersonReport('${type}','${id}')">طباعة التقرير</button><button class="btn" onclick="closeModal()">إغلاق</button></div></div>${html}`);
}

  <div class="card"><h3>تقرير بائع</h3><select id="sellerReportSelect"><option value="">اختر البائع</option>${sellerOpts}</select><button class="btn dark" style="margin-top:10px" onclick="openPersonReport('seller',document.getElementById('sellerReportSelect').value)">عرض التقرير</button></div>
  <div class="card"><h3>تقرير مشتري</h3><select id="buyerReportSelect"><option value="">اختر المشتري</option>${buyerOpts}</select><button class="btn dark" style="margin-top:10px" onclick="openPersonReport('buyer',document.getElementById('buyerReportSelect').value)">عرض التقرير</button></div>
  <div class="card"><h3>تقرير داعم</h3><select id="supporterReportSelect"><option value="">اختر الداعم</option>${supporterOpts}</select><button class="btn dark" style="margin-top:10px" onclick="openPersonReport('supporter',document.getElementById('supporterReportSelect').value)">عرض التقرير</button></div>
 </div>
 <div class="section-head" style="margin-top:18px"><div><h2>تقرير إدارة المزاد</h2><div class="small">يبقى موجود مثل قبل.</div></div><div class="actions no-print"><button class="btn dark" onclick="window.print()">طباعة تقرير الإدارة</button><button class="btn" onclick="exportCSV()">تصدير CSV</button></div></div>
 <div class="card"><h3>أعلى المشترين حسب إجمالي المشتريات</h3><div class="table-wrap"><table><thead><tr><th>#</th><th>المشتري</th><th>الرؤوس</th><th>إجمالي المشتريات</th><th>عمولة الإدارة</th><th>المتبقي للإدارة</th></tr></thead><tbody>${br||'<tr><td colspan="6">لا توجد مبيعات.</td></tr>'}</tbody></table></div></div>
 <div class="card" style="margin-top:14px"><h3>ملخص الملاك</h3><div class="table-wrap"><table><thead><tr><th>المالك</th><th>الرؤوس</th><th>المباع</th><th>مزايدات المشترين</th><th>الدعم</th><th>إجمالي مستحق المالك</th></tr></thead><tbody>${sr||'<tr><td colspan="6">لا توجد بيانات.</td></tr>'}</tbody></table></div></div>`;
}
function showSettings(){
 showModal(`<h3>إعدادات المزاد</h3><form onsubmit="saveSettings(event)">
 <div style="margin-bottom:10px"><label>اسم المزاد</label><input name="title" value="${esc(db.settings.title)}"></div>
 <div class="split"><div><label>نسبة العمولة %</label><input name="commission" type="number" min="0" max="100" step="0.1" value="${db.settings.commission}"></div>
 <div><label>عدد الشبوك</label><input name="pens" type="number" min="1" max="100" value="${db.settings.pens}"></div></div>
 <div style="margin-top:10px"><label>العملة</label><input name="currency" value="${esc(db.settings.currency)}"></div>
 <div class="actions" style="margin-top:14px"><button class="btn dark" type="submit">حفظ</button><button class="btn" type="button" onclick="closeModal()">إلغاء</button></div>
 </form>`);
}
function saveSettings(e){
 e.preventDefault();const f=new FormData(e.target);
 db.settings.title=f.get('title').trim()||'مزاد عزبة مملكة النوادر';
 db.settings.commission=Number(f.get('commission'))||0;
 db.settings.pens=Math.max(1,Number(f.get('pens'))||12);
 db.settings.currency=f.get('currency').trim()||'د.إ';
 closeModal();saveDB();
}
function showModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-box">${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}

function exportBackup(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='auction-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);
}
document.getElementById('importFile').addEventListener('change',e=>{
 const file=e.target.files[0]; if(!file)return;
 const r=new FileReader();r.onload=()=>{
  try{const x=JSON.parse(r.result); if(!x.sellers||!x.livestock||!x.buyers)throw new Error(); if(confirm('سيتم استبدال البيانات الحالية بالنسخة الاحتياطية. متابعة؟')){db=x;saveDB();alert('تم الاستيراد بنجاح');}}
  catch(err){alert('ملف النسخة الاحتياطية غير صالح');}
 };r.readAsText(file);e.target.value='';
});
function exportCSV(){
 const rows=[['رقم الرأس','المالك','الشبك','الحالة','المشتري','سعر المزايدة','عمولة إدارة المزاد','من المشتري للمالك','الداعم/الداعمين','إجمالي الدعم','إجمالي مستحق المالك']];
 db.livestock.forEach(h=>{
  const owner=sellerById(h.sellerId),b=buyerById(h.buyerId);
  const sale=Number(h.salePrice||0),fee=h.status==='sold'?commission(sale):0,ownerFromBuyer=h.status==='sold'?sale-fee:0;
  rows.push([h.number,owner?.name||'',h.pen||'',h.status==='sold'?'مباع':h.status==='unsold'?'لم يتم البيع':'مسجل',b?.name||'',h.status==='sold'?sale:'',h.status==='sold'?fee:'',h.status==='sold'?ownerFromBuyer:'',h.status==='sold'?headSupports(h).map(x=>supporterById(x.supporterId)?.name||'داعم').join(' + '):'',h.status==='sold'?supportAmount(h):'',h.status==='sold'?netToSeller(h):'']);
 });
 const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='auction-report.csv';a.click();URL.revokeObjectURL(a.href);
}
initCloud();
</script>
</body>
</html>
